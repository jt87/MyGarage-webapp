{% extends "base.html" %}
{% block content %}
<div class="hero"><h1 data-title>New Tool</h1></div>
{% include "_form_status.html" %}
<form method="post" action="/tools/new" data-edit data-label="New tool" data-done="/tools">
  <div class="section">
    <div class="section-header">Tool</div>
    <div class="group">
      <label class="row field"><span class="field-label">Type</span><input class="row-input" name="kind" placeholder="Table Saw" required autofocus></label>
      <label class="row field"><span class="field-label">Size</span><input class="row-input" name="detail" placeholder="10&quot;"></label>
      <label class="row field"><span class="field-label">Brand</span><input class="row-input" name="brand" placeholder="Acme"></label>
      <label class="row field"><span class="field-label">Model</span><input class="row-input" name="model_no" placeholder="TS10" autocapitalize="characters"></label>
      <label class="row field"><span class="field-label">Category</span><input class="row-input" name="category" list="categories" placeholder="Same as type"></label>
    </div>
    <datalist id="categories">{% for c in categories %}<option value="{{ c }}">{% endfor %}</datalist>
  </div>
  <div class="section">
    <div class="section-header">Details</div>
    <div class="group">
      <label class="row field"><span class="field-label">Serial #</span><input class="row-input" name="serial" autocapitalize="characters"></label>
      <label class="row field"><span class="field-label">Purchased</span><input class="row-input" name="purchased" placeholder="2026-10-12, Menards, $150"></label>
    </div>
  </div>
  <div class="section">
    <div class="section-header">Insurance</div>
    <div class="group">
      <label class="row field"><span class="field-label">Paid</span><input class="row-input" name="paid" inputmode="decimal" placeholder="$150"></label>
      <label class="row field"><span class="field-label">Replacement</span><input class="row-input" name="value" inputmode="decimal" placeholder="~$300"></label>
    </div>
    <p class="section-footer">After saving, add photos and the receipt from the tool's page.</p>
  </div>
  <div class="section"><div class="group"><button class="row action center" type="submit">Add Tool</button></div></div>
</form>
{% endblock %}
