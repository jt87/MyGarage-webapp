<!doctype html>
<html lang="en">
<head>
{% include "_auth_head.html" %}
<title>Log In · {{ site_title }}</title>
</head>
<body class="login-body">
<form class="login" method="post" action="/login?next={{ next|q }}">
  <img class="app-icon" src="/static/apple-touch-icon.png" alt="">
  <h1>{{ site_title }}</h1>
  <p class="t-subhead secondary">Log in to view your tools and project files.</p>
  <div class="group">
    <label class="row"><span class="sr-only">Username</span><input name="username" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus></label>
    <label class="row"><span class="sr-only">Password</span><input name="password" type="password" placeholder="Password" autocomplete="current-password" required></label>
  </div>
  <div class="group" style="margin-top:0">
    <label class="row"><span class="row-body">Remember Me</span><input class="switch" type="checkbox" name="remember" checked></label>
  </div>
  <p class="login-foot t-footnote secondary">Keeps you logged in on this device for 30 days.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <button class="btn-filled">Log In</button>
</form>
</body>
</html>
