# TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML. Paste this,
# then replace every CHANGE_ME. See webapp/README.md for the full walkthrough.
services:
  mygarage:
    image: ghcr.io/jt87/garage-tools-web:latest
    container_name: mygarage
    restart: unless-stopped
    user: "568:568"            # TrueNAS "apps" user; owns the data folder below
    ports:
      - "8088:8000"            # http://<truenas-ip>:8088 on your LAN
    environment:
      SITE_TITLE: MyGarage
      # Content comes from this repo. The server keeps a clone in /data as its
      # cache and serves every page from it. It asks GitHub for changes when a
      # push webhook arrives, or at most every FRESHNESS_SECONDS when someone
      # is using the site, or every SYNC_INTERVAL otherwise.
      GIT_REPO_URL: https://github.com/jt87/garage-tools.git
      GIT_BRANCH: main
      GIT_TOKEN: CHANGE_ME       # fine-grained GitHub token: this repo only, Contents = Read-only
      WEBHOOK_SECRET: CHANGE_ME  # same secret as the GitHub webhook (see README); instant updates
      FRESHNESS_SECONDS: "300"
      SYNC_INTERVAL: "1800"
      GITHUB_REPO: jt87/garage-tools   # adds "Edit" links to GitHub; remove to hide them
      # Sign-in. Leave both set unless your reverse proxy already does auth.
      AUTH_USERNAME: jared
      AUTH_PASSWORD: CHANGE_ME
      SECRET_KEY: CHANGE_ME    # any long random string; keeps you signed in across restarts
      COOKIE_SECURE: "false"   # "true" once you only reach it over https
    volumes:
      - /mnt/CHANGE_ME_POOL/apps/mygarage:/data   # repo clone + thumbnail cache; safe to delete
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 60s
      timeout: 5s
      start_period: 120s
