# TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML. Paste this,
# change the CHANGE_ME below, then open http://<truenas-ip>:8088 on your home
# Wi-Fi. The first screens create your login and ask where your garage lives
# (on this server, or in a GitHub repo). See README.md for the walkthrough.
services:
  mygarage:
    image: ghcr.io/jt87/mygarage:1
    container_name: mygarage
    restart: unless-stopped
    user: "568:568"            # TrueNAS "apps" user; owns the data folder below
    ports:
      - "8088:8000"            # http://<truenas-ip>:8088 on your LAN
    environment:
      SITE_TITLE: MyGarage
      # Optional. Storage and GitHub are set up in the app; these only exist
      # for scripted installs and 1.0 setups, and lock the choice when set.
      # GIT_REPO_URL: https://github.com/you/your-garage.git
      # GIT_TOKEN: github_pat_...      # fine-grained, this repo only, Contents: Read and write
      # WEBHOOK_SECRET: ...            # otherwise one is made and shown in Settings
      # READ_ONLY: "true"              # turn off editing from the app
    volumes:
      - /mnt/CHANGE_ME_POOL/apps/mygarage:/data   # your garage (if kept on the server), cache, and config/ (keep it)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 60s
      timeout: 5s
      start_period: 120s
