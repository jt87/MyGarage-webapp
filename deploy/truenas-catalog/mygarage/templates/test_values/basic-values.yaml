# A default install: MyGarage on its own port with an ixVolume for /data.
TZ: America/Chicago

mygarage:
  additional_envs:
    - name: SITE_TITLE
      value: Test Garage

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8088
    host_ips: []

ix_volumes:
  data: /opt/tests/mnt/mygarage

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []

labels: []

resources:
  limits:
    cpus: 1
    memory: 1024
